<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B0F19">
  <title>SPORT ANALYTICS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { user-select: none; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-[#0B0F19] text-white font-sans pb-24">

  <!-- En-tête Mobile -->
  <header class="sticky top-0 bg-[#0B0F19] p-4 border-b border-slate-800 flex justify-between items-center z-50">
    <div>
      <h1 class="text-lg font-black tracking-wider">SPORT<span class="text-[#00E676]">ANALYTICS</span></h1>
      <p class="text-[9px] text-slate-400 font-mono">IA & PRÉDICTIONS SPORTIVES</p>
    </div>
    <span class="text-[10px] bg-emerald-500/20 text-[#00E676] px-2.5 py-1 rounded-lg font-bold font-mono">★ VIP ACTIF</span>
  </header>

  <div class="p-4 space-y-4">
    <!-- Info Paiement RDC -->
    <div class="bg-gradient-to-r from-slate-900 to-emerald-950 p-3 rounded-xl border border-emerald-500/30 text-xs">
      <strong class="text-[#00E676]">RDC Mobile Money :</strong> M-Pesa, Orange Money, Airtel Money intégrés.
    </div>

    <!-- Match 1 : En direct -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex justify-between text-[11px] text-slate-400 mb-2">
        <span>Champions League</span>
        <span class="text-red-400 font-bold">● 68' DIRECT</span>
      </div>
      <div class="flex justify-between items-center font-bold text-base">
        <span>Arsenal</span>
        <span class="text-[#00E676] font-mono text-xl">2 - 1</span>
        <span>Man. City</span>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-800">
        <div class="flex justify-between text-[10px] font-mono text-slate-400 mb-1">
          <span class="text-[#00E676]">1: 62%</span>
          <span>X: 24%</span>
          <span class="text-sky-400">2: 14%</span>
        </div>
        <div class="w-full h-1.5 bg-slate-950 rounded-full flex overflow-hidden">
          <div style="width: 62%" class="bg-[#00E676]"></div>
          <div style="width: 24%" class="bg-slate-600"></div>
          <div style="width: 14%" class="bg-sky-400"></div>
        </div>
      </div>
      <div class="mt-3 flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded-xl">
        <span>Conseil : <b class="text-[#00E676]">+3.5 buts</b></span>
        <button onclick="ajouterMatch()" class="bg-[#00E676] text-slate-950 px-3 py-1 rounded-lg font-bold">+ 1.88</button>
      </div>
    </div>

    <!-- Match 2 : CAF / RDC -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex justify-between text-[11px] text-slate-400 mb-2">
        <span>CAF Champions League</span>
        <span class="text-[#00E676] font-mono">15:30</span>
      </div>
      <div class="flex justify-between items-center font-bold text-base">
        <span>TP Mazembe</span>
        <span class="text-xs text-slate-500">VS</span>
        <span>Sundowns</span>
      </div>
      <div class="grid grid-cols-3 gap-2 mt-3 text-center text-xs font-mono">
        <button onclick="ajouterMatch()" class="bg-slate-950 p-2 rounded-lg border border-slate-800">1 : <b class="text-[#00E676]">2.10</b></button>
        <button onclick="ajouterMatch()" class="bg-slate-950 p-2 rounded-lg border border-slate-800">X : 3.05</button>
        <button onclick="ajouterMatch()" class="bg-slate-950 p-2 rounded-lg border border-slate-800">2 : <b class="text-sky-400">3.40</b></button>
      </div>
    </div>
  </div>

  <!-- Barre tactile du bas (Navigation Android) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 py-3 px-6 flex justify-between text-xs z-50">
    <button class="text-[#00E676] font-bold">⚽ Matchs</button>
    <button class="text-slate-400">📈 Pronos</button>
    <button class="text-slate-400">🎫 Coupon (<span id="count">2</span>)</button>
    <button class="text-slate-400">👤 Compte</button>
  </nav>

  <script>
    let c = 2;
    function ajouterMatch() {
      c++;
      document.getElementById('count').innerText = c;
      alert('Match ajouté au coupon combiné ! Total : ' + c);
    }
  </script>
</body>
</html>
